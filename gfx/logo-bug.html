<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1">
  <title>Logo bug</title>
  <style>
    :root {
      --stage-width: 1920px;
      --stage-height: 1080px;
    }

    html,
    body {
      width: var(--stage-width);
      height: var(--stage-height);
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    .stage {
      position: relative;
      width: var(--stage-width);
      height: var(--stage-height);
      opacity: 1;
      transform: translate3d(0, 0, 0);
    }

    .stage.is-playing {
      animation: template-in 420ms cubic-bezier(.16, 1, .3, 1) both;
    }

    .stage.is-stopping {
      animation: template-out 280ms cubic-bezier(.7, 0, .84, 0) both;
    }

    .logo-bug {
      position: absolute;
      left: 1714px;
      top: 870px;
      width: 139px;
      height: 105.25px;
      pointer-events: none;
      user-select: none;
    }

    .panel {
      position: absolute;
      left: 1688px;
      top: 847px;
      width: 192px;
      height: 160px;
      border-radius: 20px;
      overflow: hidden;
      background: transparent;
      filter: blur(.5px);
      box-shadow:
        inset 0 0 0 1000px rgba(0, 0, 0, .4),
        0 4px 10px rgba(0, 0, 0, .8),
        0 0 26px rgba(0, 0, 0, .35),
        inset 0 2px 1px rgba(255, 255, 255, .5),
        inset 0 0 32px rgba(255, 255, 255, .03);
      pointer-events: none;
      user-select: none;
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .055), rgba(255, 255, 255, 0) 30%),
        radial-gradient(ellipse at 16% 0%, rgba(255, 255, 255, .1), transparent 42%),
        radial-gradient(ellipse at 50% 100%, rgba(0, 0, 0, .34), transparent 58%);
      pointer-events: none;
    }

    .panel::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      opacity: .16;
      background-image:
        radial-gradient(circle at 17% 32%, rgba(255, 255, 255, .12) 0 .8px, transparent .9px),
        radial-gradient(circle at 71% 64%, rgba(0, 0, 0, .3) 0 .9px, transparent 1px);
      background-size: 4px 4px, 5px 5px;
      mix-blend-mode: overlay;
      pointer-events: none;
    }

    .logo-mark {
      position: absolute;
      left: 14.96px;
      top: .05px;
      width: 120.002px;
      height: 56.0834px;
      overflow: visible;
    }

    .logo-text {
      position: absolute;
      left: 0;
      top: 70.93px;
      width: 138.999px;
      height: 34.3208px;
      display: block;
    }

    .logo-bug.is-text-hidden .logo-dot,
    .logo-bug.is-text-hidden .logo-text {
      display: none;
    }

    @keyframes template-in {
      from {
        opacity: 0;
        transform: translate3d(-40px, 18px, 0);
      }
      to {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
    }

    @keyframes template-out {
      from {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
      to {
        opacity: 0;
        transform: translate3d(-40px, 18px, 0);
      }
    }
  </style>
</head>
<body>
  <main id="template" class="stage">
    <div class="panel"></div>
    <div id="logo-bug" class="logo-bug" aria-label="360 sekúnd">
      <svg class="logo-mark" preserveAspectRatio="none" overflow="visible" viewBox="0 0 120.002 56.0834" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <g>
          <path d="M0.00253666 55.3977V46.2348H13.1016C17.5144 46.2348 20.0252 44.2668 20.0252 40.8051C20.0252 37.3433 17.5144 35.3753 13.1016 35.3753H5.43236V28.046L15.7493 18.069H0.00253666V9.24594H28.5769V16.6437L17.5804 27.2319C25.6579 28.5887 30.2051 33.5442 30.2051 41.1449C30.2051 50.1734 23.8243 55.3977 12.7617 55.3977H0H0.00253666Z" fill="white"/>
          <path d="M32.5851 39.3786V37.4106C32.5851 32.455 34.893 27.3651 40.8655 19.8988L49.3488 9.24219H60.6827L51.0455 21.1872L52.4708 21.1187C61.7022 21.1187 68.5574 27.9053 68.5574 37.408V39.376C68.5574 49.1501 61.3624 56.0737 50.5712 56.0737C39.7801 56.0737 32.5851 49.1501 32.5851 39.376V39.3786ZM58.7172 39.2442V37.5475C58.7172 32.9318 55.3239 29.5385 50.5712 29.5385C45.8186 29.5385 42.4252 32.9318 42.4252 37.5475V39.2442C42.4252 43.8598 45.8186 47.2531 50.5712 47.2531C55.3239 47.2531 58.7172 43.8598 58.7172 39.2442Z" fill="white"/>
          <path d="M71.2698 37.7576V26.8981C71.2698 15.4958 79.0075 8.57227 89.5958 8.57227C100.184 8.57227 107.922 15.4958 107.922 26.8981V37.7576C107.922 49.1599 100.184 56.0834 89.5958 56.0834C79.0075 56.0834 71.2698 49.1599 71.2698 37.7576ZM97.7418 37.7576V26.8981C97.7418 20.8571 94.417 17.7352 89.5958 17.7352C84.7747 17.7352 81.4498 20.8571 81.4498 26.8981V37.7576C81.4498 43.7986 84.7772 46.9205 89.5958 46.9205C94.4144 46.9205 97.7418 43.7986 97.7418 37.7576Z" fill="white"/>
          <path class="logo-dot" d="M97.1889 11.2577C97.1889 4.85915 102.107 0 108.625 0C115.143 0 120.002 4.85915 120.002 11.2577C120.002 17.6563 115.084 22.5154 108.625 22.5154C102.165 22.5154 97.1889 17.6563 97.1889 11.2577Z" fill="#2C7DFF"/>
        </g>
      </svg>
      <img class="logo-text" src="../assets/logo-bug-sekund.svg" alt="" aria-hidden="true">
    </div>
  </main>

  <script>
    (() => {
      const templateElement = document.getElementById("template");
      const logoElement = document.getElementById("logo-bug");

      function parseTemplateData(rawData) {
        if (!rawData) return {};
        if (typeof rawData === "object") return rawData;

        const data = String(rawData).trim();
        if (!data) return {};

        try {
          return JSON.parse(data);
        } catch (error) {
          // CasparCG Client commonly sends templateData XML.
        }

        const result = {};
        try {
          const xml = new DOMParser().parseFromString(data, "text/xml");
          xml.querySelectorAll("componentData").forEach((component) => {
            const id = component.getAttribute("id");
            const valueNode = component.querySelector("data");
            if (!id || !valueNode) return;
            result[id] = valueNode.getAttribute("value") || valueNode.textContent || "";
          });
        } catch (error) {
          console.warn("Unable to parse template data", error);
        }
        return result;
      }

      function parseBoolean(value) {
        if (value === undefined) return true;
        if (typeof value === "boolean") return value;
        if (typeof value === "number") return value !== 0;

        const normalized = String(value).trim().toLowerCase();
        if (["false", "0", "off", "no", "nie"].includes(normalized)) return false;
        return true;
      }

      function applyData(rawData) {
        const data = parseTemplateData(rawData);
        const textValue = [data.text, data.Text].find((value) => value !== undefined);
        if (textValue === undefined) return;

        const showText = parseBoolean(textValue);
        logoElement.classList.toggle("is-text-hidden", !showText);
      }

      function play() {
        templateElement.classList.remove("is-stopping");
        templateElement.classList.remove("is-playing");
        void templateElement.offsetWidth;
        templateElement.classList.add("is-playing");
      }

      function stop() {
        templateElement.classList.remove("is-playing");
        templateElement.classList.add("is-stopping");
      }

      function update(rawData) {
        applyData(rawData);
        return Promise.resolve();
      }

      window.play = play;
      window.stop = stop;
      window.update = update;
      window.applyData = applyData;
    })();
  </script>
</body>
</html>

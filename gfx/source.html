<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1">
  <title>Spravy 360 - Source</title>
  <style>
    :root {
      --stage-width: 1920px;
      --stage-height: 1080px;
    }

    html,
    body {
      width: var(--stage-width);
      height: var(--stage-height);
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    @font-face {
      font-family: "Bauplan";
      font-style: normal;
      font-weight: 900;
      src: local("Bauplan Heavy"), local("Bauplan-Heavy"), local("Bauplan");
    }

    @font-face {
      font-family: "Diform";
      font-style: normal;
      font-weight: 700;
      src: local("Diform Bold"), local("Diform-Bold"), local("Diform");
    }

    .stage {
      position: relative;
      width: var(--stage-width);
      height: var(--stage-height);
      opacity: 1;
      transform: translate3d(0, 0, 0);
    }

    .stage.is-playing {
      animation: template-in 420ms cubic-bezier(.16, 1, .3, 1) both;
    }

    .stage.is-stopping {
      animation: template-out 280ms cubic-bezier(.7, 0, .84, 0) both;
    }

    .source {
      position: absolute;
      top: 40px;
      left: 40px;
      isolation: isolate;
      max-width: 640px;
      padding: 10px 20px 11px;
      margin: 0;
      border-radius: 10px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .055), rgba(255, 255, 255, 0) 30%),
        radial-gradient(ellipse at 16% 0%, rgba(255, 255, 255, .1), transparent 42%),
        radial-gradient(ellipse at 50% 100%, rgba(0, 0, 0, .34), transparent 58%),
        rgba(0, 0, 0, .4);
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      word-break: normal;
      letter-spacing: 0;
      text-rendering: geometricPrecision;
      -webkit-font-smoothing: antialiased;
      font-kerning: normal;
      font-feature-settings: "kern" 1;
      font-family: "Diform", Arial, Helvetica, sans-serif;
      font-size: 22px;
      font-weight: 700;
      line-height: 26px;
      text-align: left;
      text-transform: uppercase;
      box-shadow:
        inset 0 0 0 1000px rgba(0, 0, 0, .16),
        0 2px 5px rgba(0, 0, 0, .75),
        0 0 13px rgba(0, 0, 0, .35),
        inset 0 1px 1px rgba(255, 255, 255, .5),
        inset 0 0 16px rgba(255, 255, 255, .03);
      filter: blur(.25px);
      user-select: none;
    }

    .source::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      opacity: .16;
      background-image:
        radial-gradient(circle at 17% 32%, rgba(255, 255, 255, .12) 0 .8px, transparent .9px),
        radial-gradient(circle at 71% 64%, rgba(0, 0, 0, .3) 0 .9px, transparent 1px);
      background-size: 4px 4px, 5px 5px;
      mix-blend-mode: overlay;
      pointer-events: none;
    }

    .source:empty {
      display: none;
    }

    @keyframes template-in {
      from {
        opacity: 0;
        transform: translate3d(-40px, 18px, 0);
      }
      to {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
    }

    @keyframes template-out {
      from {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
      to {
        opacity: 0;
        transform: translate3d(-40px, 18px, 0);
      }
    }
  </style>
</head>
<body>
  <main id="template" class="stage">
    <p id="source" class="source">Zdroj: YT</p>
  </main>

  <script>
    (() => {
      const templateElement = document.getElementById("template");
      const fields = {
        source: document.getElementById("source")
      };

      function parseTemplateData(rawData) {
        if (!rawData) return {};
        if (typeof rawData === "object") return rawData;

        const data = String(rawData).trim();
        if (!data) return {};

        try {
          return JSON.parse(data);
        } catch (error) {
          // CasparCG Client commonly sends templateData XML.
        }

        const result = {};
        try {
          const xml = new DOMParser().parseFromString(data, "text/xml");
          xml.querySelectorAll("componentData").forEach((component) => {
            const id = component.getAttribute("id");
            const valueNode = component.querySelector("data");
            if (!id || !valueNode) return;
            result[id] = valueNode.getAttribute("value") || valueNode.textContent || "";
          });
        } catch (error) {
          console.warn("Unable to parse template data", error);
        }
        return result;
      }

      function applyData(rawData) {
        const data = parseTemplateData(rawData);
        const nextSource = [data.source, data.Source].find((value) => value !== undefined);

        if (nextSource !== undefined) fields.source.textContent = nextSource;
      }

      function play() {
        templateElement.classList.remove("is-stopping");
        templateElement.classList.remove("is-playing");
        void templateElement.offsetWidth;
        templateElement.classList.add("is-playing");
      }

      function stop() {
        templateElement.classList.remove("is-playing");
        templateElement.classList.add("is-stopping");
      }

      function update(rawData) {
        applyData(rawData);
      }

      window.play = play;
      window.stop = stop;
      window.update = update;
      window.applyData = applyData;

      applyData({});
    })();
  </script>
</body>
</html>

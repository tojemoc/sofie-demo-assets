<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1">
  <title>Spravy 360 - Headline</title>
  <style>
    :root {
      --stage-width: 1920px;
      --stage-height: 1080px;
    }

    html,
    body {
      width: var(--stage-width);
      height: var(--stage-height);
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    @font-face {
      font-family: "Bauplan";
      font-style: normal;
      font-weight: 900;
      src: local("Bauplan Heavy"), local("Bauplan-Heavy"), local("Bauplan");
    }

    @font-face {
      font-family: "Diform";
      font-style: normal;
      font-weight: 700;
      src: local("Diform Bold"), local("Diform-Bold"), local("Diform");
    }

    .stage {
      position: relative;
      width: var(--stage-width);
      height: var(--stage-height);
      opacity: 1;
      transform: translate3d(0, 0, 0);
    }

    .stage.is-playing {
      animation: template-in 420ms cubic-bezier(.16, 1, .3, 1) both;
    }

    .stage.is-stopping {
      animation: template-out 280ms cubic-bezier(.7, 0, .84, 0) both;
    }

    .panel {
      position: absolute;
      left: 40px;
      width: 1626px;
      height: 160px;
      border-radius: 20px;
      overflow: hidden;
      background: transparent;
      filter: blur(.5px);
      box-shadow:
        inset 0 0 0 1000px rgba(0, 0, 0, .4),
        0 4px 10px rgba(0, 0, 0, .8),
        0 0 26px rgba(0, 0, 0, .35),
        inset 0 2px 1px rgba(255, 255, 255, .5),
        inset 0 0 32px rgba(255, 255, 255, .03);
      pointer-events: none;
      user-select: none;
    }

    .headline-panel {
      top: 690px;
    }

    .subline-panel {
      top: 871px;
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .055), rgba(255, 255, 255, 0) 30%),
        radial-gradient(ellipse at 16% 0%, rgba(255, 255, 255, .1), transparent 42%),
        radial-gradient(ellipse at 50% 100%, rgba(0, 0, 0, .34), transparent 58%);
      pointer-events: none;
    }

    .panel::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      opacity: .16;
      background-image:
        radial-gradient(circle at 17% 32%, rgba(255, 255, 255, .12) 0 .8px, transparent .9px),
        radial-gradient(circle at 71% 64%, rgba(0, 0, 0, .3) 0 .9px, transparent 1px);
      background-size: 4px 4px, 5px 5px;
      mix-blend-mode: overlay;
      pointer-events: none;
    }

    .line {
      position: absolute;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      word-break: normal;
      letter-spacing: 0;
      text-rendering: geometricPrecision;
      -webkit-font-smoothing: antialiased;
      font-kerning: normal;
      font-feature-settings: "kern" 1;
    }

    .line {
      left: 80px;
      width: auto;
      max-width: 1566px;
      height: 104px;
      color: #fff;
      font-family: "Bauplan", "Arial Black", Arial, Helvetica, sans-serif;
      font-size: 86px;
      font-weight: 900;
      line-height: 104px;
    }

    .headline {
      top: 683px;
    }

    .subline {
      top: 883px;
    }

    @keyframes template-in {
      from {
        opacity: 0;
        transform: translate3d(-40px, 18px, 0);
      }
      to {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
    }

    @keyframes template-out {
      from {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
      to {
        opacity: 0;
        transform: translate3d(-40px, 18px, 0);
      }
    }
  </style>
</head>
<body>
  <main id="template" class="stage">
    <div class="panel headline-panel"></div>
    <p id="headline" class="line headline">Kamenický o konsolidácií Slovenska</p>
    <div class="panel subline-panel"></div>
    <p id="subline" class="line subline">Doplnkový riadok ide sem</p>
  </main>

  <script>
    (() => {
      const templateElement = document.getElementById("template");
      const fields = {
        headline: document.getElementById("headline"),
        subline: document.getElementById("subline")
      };
      const panels = {
        headline: document.querySelector(".headline-panel"),
        subline: document.querySelector(".subline-panel")
      };

      function fitLine(element, panel, maxSize, minSize) {
        const maxTextWidth = 1566;
        const panelPadding = 60;

        element.style.width = "auto";
        element.style.fontSize = maxSize + "px";

        let size = maxSize;
        while (element.scrollWidth > maxTextWidth && size > minSize) {
          size -= 1;
          element.style.fontSize = size + "px";
        }

        const textWidth = Math.min(Math.ceil(element.scrollWidth), maxTextWidth);
        element.style.width = textWidth + "px";
        panel.style.width = (textWidth + panelPadding) + "px";
      }

      function parseTemplateData(rawData) {
        if (!rawData) return {};
        if (typeof rawData === "object") return rawData;

        const originalData = String(rawData).trim();
        if (!originalData) return {};

        const candidates = [originalData];
        try {
          const decodedData = decodeURIComponent(originalData);
          if (decodedData !== originalData) candidates.push(decodedData);
        } catch (error) {
          // Keep the original payload when it is not URL encoded.
        }

        for (const candidate of candidates) {
          try {
            return JSON.parse(candidate);
          } catch (error) {
            // CasparCG Client commonly sends templateData XML.
          }
        }

        const result = {};
        try {
          const xml = new DOMParser().parseFromString(candidates[candidates.length - 1], "text/xml");
          xml.querySelectorAll("componentData").forEach((component) => {
            const id = component.getAttribute("id");
            const valueNode = component.querySelector("data");
            if (!id || !valueNode) return;
            result[id] = valueNode.getAttribute("value") || valueNode.textContent || "";
          });
        } catch (error) {
          console.warn("Unable to parse template data", error);
        }
        return result;
      }

      function fieldValue(value) {
        if (value === undefined || value === null) return undefined;
        if (typeof value !== "object") return value;
        return [value.value, value.text, value.name].find((item) => item !== undefined);
      }

      function applyData(rawData) {
        const data = parseTemplateData(rawData);
        const nextHeadline = [data.headline, data.Headline].map(fieldValue).find((value) => value !== undefined);
        const nextSubline = [data.subline, data.Subline].map(fieldValue).find((value) => value !== undefined);

        if (nextHeadline !== undefined) fields.headline.textContent = nextHeadline;
        if (nextSubline !== undefined) fields.subline.textContent = nextSubline;

        fitLine(fields.headline, panels.headline, 86, 48);
        fitLine(fields.subline, panels.subline, 86, 48);
      }

      function play(rawData) {
        if (rawData !== undefined) applyData(rawData);
        templateElement.classList.remove("is-stopping");
        templateElement.classList.remove("is-playing");
        void templateElement.offsetWidth;
        templateElement.classList.add("is-playing");
        return Promise.resolve();
      }

      function stop() {
        templateElement.classList.remove("is-playing");
        templateElement.classList.add("is-stopping");
        return Promise.resolve();
      }

      function update(rawData) {
        applyData(rawData);
        return Promise.resolve();
      }

      window.play = play;
      window.stop = stop;
      window.update = update;
      window.applyData = applyData;

      applyData({});
    })();
  </script>
</body>
</html>
